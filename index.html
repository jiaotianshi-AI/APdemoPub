<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'">
  <title data-i18n="meta.title">AP 自学演示首页</title>
  <meta name="description" content="" data-i18n-content="meta.description">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="page">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" id="brand"></div>
        <div class="topbar-right">
          <div class="lang" role="group" data-i18n-aria-label="a11y.langGroup">
            <button type="button" class="lang-btn" data-lang="zh" lang="zh-CN">中文</button>
            <span class="lang-sep" aria-hidden="true">|</span>
            <button type="button" class="lang-btn" data-lang="en" lang="en">EN</button>
          </div>
          <button type="button" class="login-btn" id="login-btn">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span data-i18n="login.btn">登录</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container" id="main">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" data-i18n="hero.title"></h1>
        <p class="hero-sub" data-i18n="hero.subtitle"></p>
      </section>

      <!-- 主模块：进度测试（DOM 顺序最前） -->
      <section class="card module module-primary" id="mod-progress" aria-labelledby="h-progress">
        <h2 id="h-progress" class="module-title" data-i18n="mod.progress.title"></h2>
        <p class="tagline" data-i18n="mod.progress.tagline"></p>
        <div class="module-body" id="progress-body"><p class="muted" data-i18n="common.loading"></p></div>
      </section>

      <!-- 辅助模块：顺序固定 -->
      <div class="aux">
        <section class="card module module-aux" id="mod-sites" aria-labelledby="h-sites">
          <h2 id="h-sites" class="module-title" data-i18n="mod.sites.title"></h2>
          <p class="tagline" data-i18n="mod.sites.tagline"></p>
          <div class="module-body" id="sites-body"><p class="muted" data-i18n="common.loading"></p></div>
        </section>

        <section class="card module module-aux" id="mod-videos" aria-labelledby="h-videos">
          <h2 id="h-videos" class="module-title" data-i18n="mod.videos.title"></h2>
          <p class="tagline" data-i18n="mod.videos.tagline"></p>
          <div class="module-body" id="videos-body"><p class="muted" data-i18n="common.loading"></p></div>
        </section>

        <section class="card module module-aux" id="mod-qa" aria-labelledby="h-qa">
          <h2 id="h-qa" class="module-title" data-i18n="mod.qa.title"></h2>
          <p class="tagline" data-i18n="mod.qa.tagline"></p>
          <div class="module-body" id="qa-body"><p class="muted" data-i18n="common.loading"></p></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <p data-i18n="footer.disclaimer"></p>
    </footer>
  </div>

  <!-- 通用模态窗口（登录提示、视频） -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-dialog" id="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-head">
        <h2 id="modal-title" class="modal-title"></h2>
        <button type="button" class="modal-close" id="modal-close" data-i18n="modal.close"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
