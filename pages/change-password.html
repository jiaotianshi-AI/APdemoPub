<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>修改密码</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <main class="center-page">
    <div class="auth-card">
      <p class="brand"><span class="logo">FocusGo</span></p>
      <p class="slogan">Focus. Steps. Progress.</p>
      <h1>修改密码</h1>
      <p class="lead">第一次登录需要先修改初始密码，修改后才能继续使用。</p>
      <form id="pw-form" novalidate>
        <div class="field">
          <label for="old">当前密码（初始密码）</label>
          <input id="old" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="new1">新密码</label>
          <input id="new1" type="password" autocomplete="new-password" required>
          <span class="hint">至少 8 个字符。</span>
        </div>
        <div class="field">
          <label for="new2">再输入一次新密码</label>
          <input id="new2" type="password" autocomplete="new-password" required>
        </div>
        <p id="error" class="msg error" role="alert" hidden></p>
        <div class="actions"><button type="submit" class="btn primary" id="submit">保存新密码</button></div>
      </form>
    </div>
  </main>
  <script src="/assets/js/change-password.js"></script>
</body>
</html>
