<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Focus · Writing</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/css/auth.css">
  <link rel="stylesheet" href="/assets/css/writing.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Focus · Writing<span class="slogan">Focus. Steps. Progress.</span></div>
      <div class="topbar-right">
        <span class="who" id="whoami"></span>
        <button type="button" class="btn" id="logout-btn">Sign out</button>
      </div>
    </div>
  </header>

  <main class="writing">
    <h1 class="sr-only">Writing</h1>
    <p class="notice" id="notice" role="note"></p>
    <div id="today" aria-live="polite"></div>

    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title">Past writing</h2>
      <ul id="history" class="history-list"></ul>
      <p id="history-empty" class="muted" hidden>Nothing here yet.</p>
    </section>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <div>
      <h2 id="confirm-title">Finish now?</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="confirm-cancel">Keep writing</button>
        <button type="button" class="btn primary" id="confirm-ok">Yes, I'm done</button>
      </div>
    </div>
  </dialog>

  <script src="/assets/js/page-common.js"></script>
  <script src="/assets/js/writing.js"></script>
</body>
</html>
